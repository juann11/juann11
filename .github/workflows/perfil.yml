# Regenera los SVG del perfil una vez al día (y cuando lo lances a mano)
name: Actualizar perfil

on:
  schedule:
    - cron: "0 6 * * *" # 1 a. m. en Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["resultado/generador/**"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        working-directory: resultado/generador
        run: uv run python -m pytest -q

      - name: Terminal y panel
        working-directory: resultado/generador
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m generador ../svg

      - name: Culebrita
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: resultado/svg/culebrita.svg?palette=github-dark&color_snake=#39d353

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultado/svg
          git diff --cached --quiet || (git commit -m "Actualiza los SVG del perfil" && git push)
